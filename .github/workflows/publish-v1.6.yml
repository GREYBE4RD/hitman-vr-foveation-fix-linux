name: Publish Windows v1.6

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v1.6.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the tested v1.6 script
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            -o /tmp/HitmanVRFoveationFix-v1.6-rc1.zip \
            'https://github.com/user-attachments/files/31275914/HitmanVRFoveationFix-v1.6-rc1.zip'
          echo 'dfeda9418ae13e285766f3ad3d9e57fb69ae5fd0468c3c7c566d4ae7df6018b9  /tmp/HitmanVRFoveationFix-v1.6-rc1.zip' | sha256sum -c -
          unzip -p /tmp/HitmanVRFoveationFix-v1.6-rc1.zip HitmanVRFoveationFix.ps1 > HitmanVRFoveationFix.ps1
          echo 'f405a387ee7dc68c117f7ee93bcfd31a71e0851f83f47edc0a8d8327797f6d7c  HitmanVRFoveationFix.ps1' | sha256sum -c -

      - name: Commit the final tested source
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/publish-v1.6.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HitmanVRFoveationFix.ps1 HitmanVRFoveationFix.bat README.md CHANGELOG-v1.6.md docs/HOW-IT-WORKS.md docs/UPDATING.md .github/workflows/publish-v1.6.yml
          git commit -m 'Release Windows v1.6'
          git push origin HEAD:main

      - name: Build release ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip -9 -j HitmanVRFoveationFix-v1.6.zip HitmanVRFoveationFix.ps1 HitmanVRFoveationFix.bat
          sha256sum HitmanVRFoveationFix-v1.6.zip HitmanVRFoveationFix.ps1

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          final_sha="$(git rev-parse HEAD)"
          gh release create v1.6 \
            HitmanVRFoveationFix-v1.6.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --target "$final_sha" \
            --title 'HitmanVRFoveationFix v1.6' \
            --notes-file CHANGELOG-v1.6.md
